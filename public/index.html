<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>媒体画廊 | 跨设备同步相册</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>📸 媒体画廊 <span>图片 & 视频</span></h1>
            <p class="subtitle">上传后永久保存，任何设备访问此链接均可查看</p>
        </header>

        <!-- 上传区域 -->
        <div class="upload-zone" id="uploadZone">
            <div class="upload-icon">📁🎬</div>
            <div class="upload-text">
                <strong>点击或拖拽文件到此区域</strong><br>
                支持 JPG, PNG, GIF, WebP, MP4, WebM, MOV (最大 100MB)
            </div>
            <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/webm,video/quicktime" />
            <button class="upload-btn" id="uploadBtn" type="button">选择文件</button>
        </div>

        <!-- 工具栏 -->
        <div class="gallery-toolbar">
            <div class="stats" id="statsDisplay">📦 0 个媒体文件</div>
            <button class="clear-all-btn" id="clearAllBtn" title="清空所有媒体">🗑️ 清空全部</button>
        </div>

        <!-- 媒体网格展示区 -->
        <div class="gallery-grid" id="galleryGrid">
            <div class="empty-placeholder">
                <div class="empty-icon">🖼️✨</div>
                <p>暂无媒体内容，请点击上方区域上传图片或视频</p>
                <small>支持多选，视频将显示播放控件</small>
            </div>
        </div>

        <!-- 底部提示 -->
        <footer class="app-footer">
            <p>✨ 点击卡片上的删除按钮可移除项目 | 所有媒体存储在服务器，换设备访问链接即可同步</p>
        </footer>
    </div>

    <!-- 图片预览模态框（必须在 script 之前） -->
    <div id="imageModal" class="modal">
        <span class="modal-close">&times;</span>
        <img class="modal-content" id="modalImg">
        <div id="modalCaption"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
